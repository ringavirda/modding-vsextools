name: Release

# Publishes a tagged version: the exlib-verify and exlib-shapes NuGet packages as GitHub release
# assets, and to NuGet.org through trusted publishing once the NUGET_USER repository variable is
# set. No tag is created by this workflow itself; it only runs once one exists.
on:
  push:
    tags:
      - "v*"

env:
  VS_VERSION: "1.22"

jobs:
  release:
    runs-on: ubuntu-latest

    # id-token is what lets this job exchange a GitHub OIDC token for a short-lived NuGet.org key
    # (Trusted Publishing - no stored API key). Naming any permission drops the rest to none, so
    # contents:write is restated here for the release-creation step below.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story install
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ env.VS_VERSION }}

      - name: Provision Vintage Story (server assemblies)
        run: bash scripts/exmod.sh provision game -Version "$VS_VERSION" -Kind server

      # The same gate every push runs, one more time against the tagged commit - a release never
      # ships a build that hasn't just proven itself.
      - name: Test
        run: bash scripts/exmod.sh test latest

      # The NuGet packages, built independently of anything else (see the csprojs' pack metadata:
      # PackageId, PackageVersion read from exmod.json's "tools", Authors, Description,
      # RepositoryUrl, PackageTags, PackageProjectUrl, PackageReadmeFile,
      # PackageLicenseExpression=MIT).
      - name: dotnet pack (NuGet)
        run: bash scripts/exmod.sh nuget

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nuget/*.nupkg
          generate_release_notes: true
          # A tag with a suffix (v0.3.0-preview.1) is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Publishing to NuGet.org through Trusted Publishing: nuget.org validates a short-lived OIDC
      # token from this workflow against a policy naming this repository and this file, then issues
      # a temporary key good for one hour. Nothing long-lived is stored here, so there is no key to
      # rotate or leak.
      #
      # OFF until the NUGET_USER repository variable holds the nuget.org profile name (Settings ->
      # Secrets and variables -> Actions -> Variables). Setting it is the opt-in: a tag pushed
      # before then still builds and attaches every release asset, and publishes nothing.
      #
      # The matching policy is created at nuget.org -> your name -> Trusted Publishing: this
      # repository's owner and name, workflow file release.yml, no environment, scope "Push new
      # packages and package versions", glob ExpandedLib*.
      #
      # The key is requested immediately before the push because it expires in an hour, and each
      # token buys exactly one key.
      - name: NuGet login (OIDC, no stored key)
        if: vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: vars.NUGET_USER != ''
        run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
