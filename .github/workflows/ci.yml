name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VS_VERSION: "1.22"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every script parses; a syntax error in a stage file would otherwise surface only when a
      # consuming repo runs that command.
      - name: Parse the dispatcher and every stage
        shell: pwsh
        run: |
          $errors = 0
          foreach ($f in @('exmod.ps1', 'wrappers/exmod.ps1', 'scripts/exmod.ps1') + (Get-ChildItem exmod -Filter *.ps1 | ForEach-Object FullName)) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors++; Write-Host "$f"; $parseErrors | ForEach-Object { Write-Host "  $_" } }
          }
          if ($errors -gt 0) { exit 1 }
      - name: Every command is listed
        run: bash scripts/exmod.sh help

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          # The downloaded archive is not kept: the extracted install is what the job needs, and
          # caching both doubles an already large entry.
          path: |
            .game
            !.game/.cache
          key: vs-game-client-${{ env.VS_VERSION }}
      # The client, not the server: the shapes tests paint real blocks with the game's own
      # textures, which only the client archive ships.
      - name: Provision Vintage Story (client assets)
        run: bash scripts/exmod.sh provision game -Version "$VS_VERSION" -Kind client
      - name: Test the verify and shapes tools
        run: bash scripts/exmod.sh test latest
